name: Build unsigned iOS IPA

# 产出未签名的 .ipa，供 Sideloadly 在 Windows 上用免费 Apple ID 签名安装。
# 这里只做编译、不做签名，因此不需要 Apple 开发者账号。

on:
  workflow_dispatch:
  push:
    branches: [master, main]

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Resolve workspace and scheme
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "null" ]; then
            echo "无法解析 scheme"; xcodebuild -workspace "$WORKSPACE" -list; exit 1
          fi
          echo "workspace=$WORKSPACE" >> "$GITHUB_ENV"
          echo "scheme=$SCHEME" >> "$GITHUB_ENV"
          echo "使用 workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build without code signing
        run: |
          cd ios
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 产物"; exit 1
          fi
          echo "app=$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DamaiHelper-unsigned.ipa Payload
          ls -lh DamaiHelper-unsigned.ipa
          unzip -l DamaiHelper-unsigned.ipa | head -n 15

      - uses: actions/upload-artifact@v4
        with:
          name: DamaiHelper-unsigned-ipa
          path: DamaiHelper-unsigned.ipa
          retention-days: 14